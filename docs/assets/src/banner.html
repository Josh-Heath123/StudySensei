<!doctype html>
<!--
  The README banner and the GitHub social preview, rendered to PNG by `npm run assets`
  (scripts/assets.mjs). One template: ?theme=light|dark&width=…&height=… set the variant.
  docs/DESIGN.md "Planner": ink on paper, Space Grotesk 700 for display, Inter for text,
  module colours only as square fills. Fonts are the self-hosted @fontsource files.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>StudySensei banner</title>
    <style>
      @font-face {
        font-family: "Space Grotesk";
        font-weight: 700;
        src: url("../../../node_modules/@fontsource/space-grotesk/files/space-grotesk-latin-700-normal.woff2")
          format("woff2");
      }
      @font-face {
        font-family: "Inter";
        font-weight: 100 900;
        src: url("../../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2")
          format("woff2");
      }
      :root {
        --ink: #111111;
        --paper: #ffffff;
        --muted: #5b5b5b;
        --line: #e8e8e8;
      }
      :root[data-theme="dark"] {
        --ink: #ffffff;
        --paper: #111111;
        --muted: #b3b3b3;
        --line: #3a3a3a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: var(--width);
        height: var(--height);
        background: var(--paper);
        color: var(--ink);
        overflow: hidden;
      }
      main {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: calc(var(--height) * 0.06);
        width: 100%;
        height: 100%;
        padding: 0 calc(var(--width) * 0.06);
      }
      h1 {
        margin: 0;
        font: 700 calc(var(--height) * 0.24) / 1 "Space Grotesk", sans-serif;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0;
        font: 500 calc(var(--height) * 0.075) / 1.3 "Inter", sans-serif;
        color: var(--muted);
      }
      /* Today's day timeline, in miniature: a ruled line with square module-colour blocks. */
      .day {
        position: relative;
        display: flex;
        align-items: center;
        gap: calc(var(--height) * 0.03);
        margin-top: calc(var(--height) * 0.02);
        padding-top: calc(var(--height) * 0.035);
        border-top: 2px solid var(--line);
        width: 62%;
      }
      .day span {
        width: calc(var(--height) * 0.075);
        height: calc(var(--height) * 0.075);
        border-radius: 3px;
      }
      .day .now {
        width: calc(var(--height) * 0.16);
        height: 2px;
        border-radius: 0;
        background: var(--ink);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>StudySensei</h1>
      <p>Your own course material, organised to the page.</p>
      <div class="day" aria-hidden="true">
        <span style="background: #ff7a3d"></span>
        <span style="background: #ff7a3d"></span>
        <span style="background: #ffd23f"></span>
        <span class="now"></span>
        <span style="background: #5ee0b0"></span>
        <span style="background: #8fb8ff"></span>
        <span style="background: #ff7a3d"></span>
        <span style="background: #c9a7ff"></span>
      </div>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const root = document.documentElement;
      root.dataset.theme = params.get("theme") ?? "light";
      root.style.setProperty("--width", `${params.get("width") ?? 1600}px`);
      root.style.setProperty("--height", `${params.get("height") ?? 400}px`);
    </script>
  </body>
</html>
