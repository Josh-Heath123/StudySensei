name: studysensei

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: studysensei
      POSTGRES_PASSWORD: studysensei
      POSTGRES_DB: studysensei
    ports:
      # 5433 on the host so a locally installed Postgres on 5432 doesn't clash
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studysensei -d studysensei"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
