# The COS330 Final Study Guide (a material in the app) names chapters for some past questions. Where it disagrees
# with the key above (the key maps by content to the app's tree):
study_guide_disagreements:
  - questions: "ST1 2012 2a; 2014 6a-c; 2017 6.1; 2018 6a-c (buffer overflows)"
    guide: out of scope, no chapter (older syllabus)
    key: Ch10 Buffer Overflows
  - questions: "ST1 2014 3a; 2016 3a; 2017 3.2-3.3; 2018 3 (incomplete mediation, program flaws)"
    guide: out of scope, no chapter (older syllabus)
    key: Ch11 Software Security
  - questions: "ST1 2016 4a-b; 2017 7.1; 2018 7a-b (cloud)"
    guide: out of scope, no chapter
    key: Ch13 Cloud Computing and IoT Security
  - questions: "ST1 2016 6a-b (near-miss analysis)"
    guide: out of scope, no chapter
    key: Ch11 Software Security (weak fit)
# ST1 2017 prints a chapter beside each question, from the older textbook. Against the key, by printed chapter:
