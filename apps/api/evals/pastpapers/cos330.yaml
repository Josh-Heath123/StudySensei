# COS330 past-paper answer key for spike S2 (ADR 0032) and, later, evals/pastpapers.
#
# STATUS: draft: to be confirmed by the reviewer (spot-check against the papers on the owner's disk).
#
# Metadata only: no question text. Built by reading every page of the 8 ST1 papers in the app.
# - number: as printed, e.g. "1a", "1a.ii", "1.1(a)". Metrics compare it normalised (spikes/s2_pastpapers/metrics.py).
# - Only parts that carry marks are listed (a part whose items share one mark has no listed items).
# - page: where the part starts (1-based, the app's page numbers).
# - type: recall | explain | apply | calculate | essay.
# - topics: names from the app's COS330 topic tree; the chapter first, then subtopics where clear.
# - fit: weak when the question is from the older syllabus (Pfleeger) and no topic fits it well.
# - printed_total: the total printed on the paper, or null when none is printed.
#
# Privacy (spike S2, part 1): pages with someone's answers, marking or identity are excluded from every AI call;
# a paper that is a marked script throughout is excluded entirely. Counts only, never the details.
# mask: boxes (fractions of the page: x0, y0, x1, y1) painted out of a page image before it's sent, over the
# printed examiner names (staff, not students; masked anyway).
module: COS330
excluded_papers:
  - title: ST1 2020
    reason: a marked online submission on every page (answers, scores, feedback, attempt ID in the footer)
    pages_with_personal_details: 8
  - title: ST1 2023
    reason: a marked online submission on every page; page 1 names the student
    pages_with_personal_details: 12
  - title: ST1 2025
    reason: a graded online submission on every page (final grade, receipt, answers and partial marks)
    pages_with_personal_details: 12
