  - { printed: "Chapter 2", key: Ch3 User authentication, questions: "2.1-2.3" }
  - { printed: "Chapter 3", key: Ch11 Software Security, questions: "3.1-3.4" }
  - { printed: "Chapter 4", key: Ch6 Malicious Software, questions: "4.1-4.3" }
  - { printed: "Chapter 5", key: "Ch6 Malicious Software (5.1, 5.3), Ch1 Overview (5.2, 5.4)", questions: "5.1-5.4" }
  - { printed: "Chapter 6", key: Ch10 Buffer Overflows, questions: "6.1" }
  - { printed: "Interlude A", key: Ch13 Cloud Computing and IoT Security, questions: "7.1" }
